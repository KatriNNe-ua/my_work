<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/style.css">
	<title>Parallax</title>
</head>

<body>
	<div class="wrapper">
		<section class="parallax ">
			<div class="parallax__container">
				<div class="parallax__images images-parallax">
					<div class="images-parallax__item">
						<div class="images-parallax__bg"></div>
					</div>
					<div class="images-parallax__item">
						<div class="images-parallax__star"></div>
					</div>
					<div class="images-parallax__item">
						<div class="images-parallax__ship" data-speed="0.2" data-mouse-speed="30"></div>
					</div>
					<div class="images-parallax__item">
						<div class="images-parallax__wave" data-speed="-0.1" data-mouse-speed="-200"></div>
					</div>
					<div class="images-parallax__item">
						<div class="images-parallax__one-clouds" data-speed="0.65" data-mouse-speed="70"></div>
					</div>
					<div class="parallax__text" data-speed="-0.6">
						<div class="parallax__inner letter">
							<div class="letter__item letter__item--g before">

								g
							</div>
							<div class="letter__item letter__item--o">
								o
							</div>
							<div class="letter__item letter__item--2o">
								o
							</div>
							<div class="letter__item letter__item--d">
								d
							</div>

						</div>
						<h1 class="parallax__title">dream</h1>
					</div>
					<div class="images-parallax__item">
						<div class="images-parallax__two-clouds" data-speed="0.65" data-mouse-speed="50"></div>
					</div>


				</div>
			</div>
		</section>
		<section class="ocean section-parallax">
			<div class="ocean__container">
				<div class="ocean__images">
					<div class="ocean__item">
						<div class="ocean__bg"></div>
					</div>
					<div class="bubbles"></div>
					<div class="ocean__item">
						<div class="ocean__send"></div>
					</div>
					<div class="ocean__item ocean__fish">
						<div class="ocean__sheep ocean__sheep--1"></div>
						<div class="ocean__sheep  ocean__sheep--2"></div>
						<div class="ocean__sheep  ocean__sheep--3"></div>
						<div class="ocean__sheep  ocean__sheep--4"></div>
					</div>


				</div>
			</div>
		</section>
	</div>
	<script src="js/script.js"></script>
</body>

</html>
